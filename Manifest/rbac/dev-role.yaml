apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: dev
  name: developer
rules:
  - apiGroups: [""] 
    resources:
      - pods
      - namespaces
      - nodes
      - configmaps
      - services
    verbs:
      - get
      - watch
      - list


  - apiGroups: ["apps"] 
    resources:
      - deployments
      - reeplicasets
    verbs:
      - get
      - list
