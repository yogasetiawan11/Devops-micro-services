apiVersion: v1
kind: Namespace
metadata:
  name: boutique
  labels:
    name: boutique
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: boutique
data:
  NODE_ENV: "production"
  PORT: "3001"
  AUTH_SERVICE_URL: "http://auth:3002"
  PRODUCTS_SERVICE_URL: "http://product:3003"
  ORDER_SERVICE_URL: "http://order-service:3004"
  ORDERS_SERVICE_URL: "http://orders:3005"
  USERS_SERVICE_URL: "http://user:3006"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: boutique
type: Opaque
stringData:
  AUTH_DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/auth_db"
  PRODUCT_DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/products_db"
  ORDER_SERVICE_DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/orders_db"
  ORDERS_DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/orders_db"
  USER_DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/users_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: boutique
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: PORT
              value: "3002"
            - name: ENV_NAME
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: AUTH_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: boutique
  labels:
    app: auth
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: http
---
