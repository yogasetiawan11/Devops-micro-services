name: ultimate CI 

on:
  push:
    branches: [main]
  
  # pull_request:
  #   types: [assigned, opened, edited, synchronize]

  workflow_dispatch:


env:
  # AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  # =====================================================
  # 1. Linting code 
  # =====================================================
  super-linter:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 #v9.0.0 # x-release-please-version
        env: 
          GITHUB_TOKEN: ${{ secrets.GA_TOKEN }}
          VALIDATE_ALL_CODEBASE: false

          SAVE_SUPER_LINTER_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true

          VALIDATE_YAML_PRETTIER: true
          PRE_COMMIT_CONFIG_FILE: .pre-commit-config.yaml
          VALIDATE_JSON: true
          VALIDATE_JSONL: true

          
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_JAVASCRIPT_PRETTIER: true
          VALIDATE_ENV: true
          
          
          # LINTER_RULES_PATH: .
          # FILTER_REGEX_EXCLUDE: '.*/\.venv/.*|.*/venv/.*|.*/node_modules/.*|.*/dist/.*|.*/build/.*'
          # VALIDATE_PYTHON_PYLINT: false

  # =====================================================
  # 2. TRIVY REPO SCAN
  # =====================================================

  

