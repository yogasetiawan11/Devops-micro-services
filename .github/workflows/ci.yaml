name: ultimate CI 

on:
  # push:
  #   branches: [main]
  
  # pull_request:
  #   types: [assigned, opened, edited, synchronize]

  workflow_dispatch:


env:
  # AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  # =====================================================
  # 1. Linting code 
  # =====================================================
  super-linter:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 #v9.0.0 # x-release-please-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: '.*/\.venv/.*|.*/venv/.*|.*/node_modules/.*|.*/dist/.*|.*/build/.*'
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false

  # =====================================================
  # 2. TRIVY REPO SCAN
  # =====================================================

  Trivy-repo-scanning:
    name: repo-scan
    runs-on: ubuntu-latest
    needs: super-linter
    permissions:
      contents: read          
      security-events: write  

    steps:
      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:  
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'   # scan and upload to logs ci
          severity: 'CRITICAL,HIGH'
          exit-code: 1

  # =====================================================
  # 3. BUILD DEPENDENCIES (per service)
  # =====================================================
  build-dependencies:
    name: build dependencies (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: Trivy-repo-scanning
    permissions:
      contents: read          # Required to checkout and read repo files
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: frontend
            path: projects/boutique-microservices/frontend
          - service: auth
            path: projects/boutique-microservices/backend/services/auth
          - service: gateway
            path: projects/boutique-microservices/backend/services/gateway
          - service: order-service
            path: projects/boutique-microservices/backend/services/order-service
          - service: orders
            path: projects/boutique-microservices/backend/services/orders
          - service: product-service
            path: projects/boutique-microservices/backend/services/product-service
          - service: user-service
            path: projects/boutique-microservices/backend/services/user-service
        
    steps:
      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      # this comes up from set up binary 
      - name: setup taskfile 
        uses: supplypike/setup-bin@73f5356f4d8a8588c525365fad26435ee1de4eaa #v5.0.2
        with:
          uri: 'https://github.com/go-task/task/releases/download/v3.54.0/task_linux_386.tar.gz'
          name: 'task-file'
          version: '3.54.0'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: install dependencies ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        run: |
          echo "Building applications ${{ matrix.service }} >> $GITHUB_OUTPUT"
          task install-ci

      - name: build and run ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        run: |
          echo "Building applications ${{ matrix.service }} >> $GITHUB_OUTPUT"
          task build

      - name: Test services ${{ matrix.service }}
        working-directory: ${{ matrix.path }}
        run: |
          echo "Testing applications ${{ matrix.service }} >> $GITHUB_OUTPUT"
          npm test --if-present


