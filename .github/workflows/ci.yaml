name: ultimate CI 

on:
  push:
    branches: main
  
  # pull_request:
  #   types: [assigned, opened, edited, synchronize]

  workflow_dispatch:


env:
  # AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  # =====================================================
  # 3. BUILD DEPENDENCIES (per service)
  # =====================================================
  

  Build:
    name: Build Services 
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Required to checkout and read repo files
    strategy:
      fail-fast: true
      matrix:
        service: [
                  # "projects/boutique-microservices/frontend",
                  # "projects/boutique-microservices/backend/services/auth"
                  "projects/boutique-microservices/backend/services/gateway",
                  "projects/boutique-microservices/backend/services/order-service"
                  # "projects/boutique-microservices/backend/services/orders",
                  # "projects/boutique-microservices/backend/services/product-service",
                  # "projects/boutique-microservices/backend/services/user-service"
                 ]

    steps:
      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      # this comes up from set up binary 
      - name: setup taskfile 
        uses: supplypike/setup-bin@73f5356f4d8a8588c525365fad26435ee1de4eaa #v5.0.2
        with:
          uri: 'https://github.com/go-task/task/releases/download/v3.54.0/task_linux_386.tar.gz'
          name: 'task-file'
          version: '3.54.0'

      - name: Setup gateway
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/gateway') }}
        uses: actions/setup-node@v4
 
          # actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install Backend
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/gateway') }}
        working-directory: ${{ matrix.service }}
        run: |
          echo "Building auth svc"
          task install-ci

          echo "Build and Run auth applications" 
          task build


      - name: Setup order-svc
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/order-service') }}
        uses: actions/setup-node@v4
 
          # actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install order-service
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/order-service') }}
        working-directory: ${{ matrix.service }}
        run: |
          echo "Building auth svc"
          task install-ci

          


