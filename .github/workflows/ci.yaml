name: ultimate CI 

on:
  push:
    branches: main
    paths:
      - 'projects/boutique-microservices/*'

  workflow_dispatch:


env:
  # AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  =====================================================
  1. Linting code 
  =====================================================
  super-linter:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 #v9.0.0 # x-release-please-version
        env: 
          GITHUB_TOKEN: ${{ secrets.GA_TOKEN }}
          VALIDATE_ALL_CODEBASE: false

          SAVE_SUPER_LINTER_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true

          VALIDATE_YAML_PRETTIER: false
          PRE_COMMIT_CONFIG_FILE: .pre-commit-config.yaml
          VALIDATE_JSON: true
          VALIDATE_JSONL: true

          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_JAVASCRIPT_PRETTIER: true
          VALIDATE_ENV: true
          
          FILTER_REGEX_EXCLUDE: '.*/\.github/workflows/.*'     

  # =====================================================
  # 2. Scanning Secret in the Repository 
  # =====================================================
  Trivy-repo-scanning:
    name: repo-scan
    runs-on: ubuntu-latest
    continue-on-error: true
    # needs: super-linter
    permissions:
      contents: read          
      security-events: write  

    steps:
      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:  
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'   # scan and upload to logs ci
          severity: 'CRITICAL,HIGH'
          exit-code: 1
          
  # =====================================================
  # 3. BUILD DEPENDENCIES (per service)
  # =====================================================
  filter:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Check for backend file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3  
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/utils/file-filters.yml


  Build:
    name: build-services 
    runs-on: ubuntu-latest
    needs: filter
    permissions:
      contents: read          # Required to checkout and read repo files
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJson(needs.filter.outputs.services ) }}

    steps:
      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Setup auth
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/auth') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020

        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Setup gateway
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/gateway') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020

        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Setup order-service
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/order-service') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Setup orders
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/orders') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020

        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Setup product-service
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/product-service') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020

        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Setup user-service
        if: ${{ startsWith(matrix.service, 'projects/boutique-microservices/backend/services/user-service') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020

        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      # this comes up from set up binary 
      - name: setup taskfile 
        uses: supplypike/setup-bin@73f5356f4d8a8588c525365fad26435ee1de4eaa #v5.0.2
        with:
          uri: 'https://github.com/go-task/task/releases/download/v3.54.0/task_linux_386.tar.gz'
          name: 'task-file'
          version: '3.54.0'

      - name: Install Backend
        working-directory: ${{ matrix.service }}
        run: |
          task install-ci

          if [[ "${{ matrix.service }}" == 'projects/boutique-microservices/frontend' ]]; then
            task build
          else
            echo "Skipping for Backend services" 
          fi

          task test

          


