name: Deploy (GitOps / Kustomize)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: false
        default: production

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Render and open PR to Kustomize overlays
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Kustomize overlays
        working-directory: Kustomize/overlays
        run: |
          for overlay in */; do
            echo "Validating overlay: ${overlay%/}"
            (cd "$overlay" && kustomize build) || (cd "$overlay" && kustomize build)
          done
        shell: bash
