name: CI for the app

on:
  push:
    branches: [main]
  pull_request:
    types: 
      - assigned
      - opened
      - edited
      - synchronize
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  super-linter:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      # contents permission to clone the repository
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write
      # to update commit status
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 #v9.0.0 # x-release-please-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Trivy-repo-scanning:
    name: Build
    runs-on: ubuntu-latest
    needs: super-linter
    permissions:
      contents: read          
      security-events: write  

    steps:
      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:  
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: 1

  build-dependencies:
    runs-on: ubuntu-latest
    needs: Trivy-repo-scanning
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write
    strategy:
      matrix:
        service:
          - auth
          - gateway
          - order-service
          - orders
          - product-service
          - user-service
          - frontend
     # <------ Uncommit if you perefer cache from gh  actions official ------>
      # - name: cache dependencies
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      #   id: npm-cache
      #   with:
      #     path: ${{ steps.npm-cache-dir.outputs.dir }}
      #     key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    steps:
      - name: checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: | 
            projects/boutique-microservices/backend/services/*/package-lock.json
            projects/boutique-microservices/frontend/package-lock.json

      - name: install dependency ${{ matrix.service }}
        run: |
          echo "Building applications ${{ matrix.service }} >> $GITHUB_OUTPUT"
          npm ci
          npm run build
          
      - name: upload a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build artifact
          path: build
          if-no-files-found: error
          retention-days: 5

      - name: download artifact 
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.01
        with:
          name: build artifact
        
      - name: list all artifact  
        run: ls -R



  Static-code-analysis:
    runs-on: ubuntu-latest
    needs: build-dependencies 
    steps:
      - uses: actions/checkout@v6
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          push: true
          tags: user/app:latest

          
