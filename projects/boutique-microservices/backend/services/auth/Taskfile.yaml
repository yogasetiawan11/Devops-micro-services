version: "3"

vars:
  IMAGE_REPO: yogas4
  IMAGE_TAG: foobarbaz
  SERVICE_RELEASE_TAG: projects/boutique-microservices/backend/services/auth/

# includes:
#   utils:
#     taskfile: ../../../utils/Taskfile.yaml
#     dir: ../../../utils

tasks:
  build-container-image:
    desc: Build container image
    cmds:
      - docker build -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} .

  build-container-image-multi-arch:
    desc: Build multi-arch container image
    cmds:
      - |
        docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} \
        --push \
        .


  install-ci:
    desc: install/download package dependencies [ CI, reproducible]
    cmds:
      - npm ci

  build:
    desc: Build and compile application
    cmds:
      - CI=false npm run build

  run:
    desc: Start auth service in dev mode
    cmds:
      - npm run dev

  test:
    desc: Run auth tests 
    cmds:
      - npm test --if-present



  npm-install:
    desc: install dependencies  # use build command if you have not the artifact or build the dependency for the first time
    cmds:
      - npm install 